<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Black Mamba — Snake</title>
<style>
  :root{
    --bg:#050505;
    --bg2:#0d0d0d;
    --ink:#0a0a0a;
    --mamba:#1f2a22;
    --mamba-light:#2d3d31;
    --venom:#7CFC00;
    --venom-soft:#3d8b1d;
    --gold:#d4af37;
    --blood:#8b0000;
    --bone:#e6e6d8;
    --shadow:0 0 20px rgba(124,252,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--bone);font-family:'Courier New',monospace;touch-action:none}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(circle at 20% 10%, rgba(124,252,0,.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(139,0,0,.08), transparent 40%),
      linear-gradient(180deg,#000 0%, #0a0a0a 100%);
  }
  header{
    width:100%;max-width:520px;padding:10px 14px 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .title{
    font-family:'Impact','Arial Black',sans-serif;
    letter-spacing:.18em;
    font-size:22px;
    background:linear-gradient(90deg,#fff,#7CFC00 40%,#d4af37);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 10px rgba(124,252,0,.15);
  }
  .title span{color:#8b0000;-webkit-text-fill-color:#8b0000;}
  .stats{display:flex;gap:14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a8b3a8}
  .stats b{display:block;color:var(--venom);font-size:16px;letter-spacing:.05em}
  .stage{
    position:relative;width:min(100vw - 16px, 520px);aspect-ratio:1/1;
    border:2px solid var(--mamba-light);
    border-radius:14px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 24px),
      radial-gradient(ellipse at center, #0f1410 0%, #050605 80%);
    box-shadow: var(--shadow), inset 0 0 60px rgba(0,0,0,.8);
    overflow:hidden;
    margin-top:6px;
  }
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(0,0,0,.78);backdrop-filter:blur(4px);
    text-align:center;padding:18px;gap:14px;
    transition:opacity .25s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay h2{
    font-family:'Impact','Arial Black',sans-serif;letter-spacing:.2em;font-size:28px;
    color:var(--venom);text-shadow:0 0 12px rgba(124,252,0,.6);
  }
  .overlay h2.dead{color:#ff3030;text-shadow:0 0 12px rgba(255,0,0,.6)}
  .overlay p{font-size:13px;color:#9aa49a;line-height:1.5;max-width:300px}
  .btn{
    display:inline-block;padding:12px 24px;border:1px solid var(--venom-soft);
    background:linear-gradient(180deg,#1c2a1c,#0c130c);
    color:var(--venom);letter-spacing:.18em;text-transform:uppercase;font-weight:bold;
    border-radius:8px;font-size:14px;cursor:pointer;
    box-shadow:0 0 14px rgba(124,252,0,.2), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .08s ease, box-shadow .2s ease;
  }
  .btn:active{transform:scale(.96);box-shadow:0 0 22px rgba(124,252,0,.45)}
  .controls{
    width:min(100vw - 16px, 520px);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    margin-top:14px;padding:0 6px;gap:8px;
  }
  .pad{
    display:grid;grid-template-areas:". up ." "left . right" ". down .";
    grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);
    justify-self:center;
  }
  .pad button{
    width:56px;height:56px;border-radius:14px;border:1px solid var(--mamba-light);
    background:linear-gradient(180deg,#161d17,#080a08);
    color:var(--venom);font-size:22px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 0 #000;
    transition:transform .05s ease, background .2s;
  }
  .pad button:active{transform:translateY(2px);background:linear-gradient(180deg,#243024,#0c110c);box-shadow:none}
  .pad .up{grid-area:up}.pad .down{grid-area:down}.pad .left{grid-area:left}.pad .right{grid-area:right}
  .side{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:10px;color:#5a6a5a;letter-spacing:.15em}
  .side .pause{
    width:54px;height:54px;border-radius:50%;border:1px solid var(--mamba-light);
    background:radial-gradient(circle,#1c2a1c,#0a0f0a);color:var(--venom);font-size:18px;
    box-shadow:0 0 14px rgba(124,252,0,.18);
  }
  .footer{
    width:min(100vw - 16px, 520px);
    text-align:center;font-size:10px;color:#4a554a;letter-spacing:.2em;text-transform:uppercase;
    margin-top:10px;padding-bottom:6px;
  }
  @media (max-height: 720px){
    .pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
    .pad button{width:48px;height:48px;font-size:18px}
    .side .pause{width:46px;height:46px;font-size:16px}
    .title{font-size:18px}
  }
  @media (orientation:landscape) and (max-height:520px){
    body{flex-direction:row;align-items:center;justify-content:center;gap:12px}
    header,.footer{display:none}
    .stage{height:96vh;width:96vh;max-width:96vh}
    .controls{width:auto;flex:0 0 auto;grid-template-columns:auto;grid-template-rows:auto auto;margin:0}
  }
</style>
</head>
<body>

<header>
  <div class="title">BLACK <span>MAMBA</span></div>
  <div class="stats">
    <div>SCORE<b id="score">0</b></div>
    <div>BEST<b id="best">0</b></div>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="game" width="480" height="480"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">BLACK MAMBA</h2>
    <p id="overlayText">Glissez pour diriger le mamba.<br>Mordez la proie. Évitez votre propre venin.</p>
    <button class="btn" id="startBtn">DÉMARRER</button>
    <p style="font-size:10px;color:#4a554a">Swipe • D-Pad • Touches flèches</p>
  </div>
</div>

<div class="controls">
  <div class="side">
    <button class="pause" id="pauseBtn" aria-label="Pause">II</button>
    <span>PAUSE</span>
  </div>
  <div class="pad" aria-label="Direction">
    <button class="up" data-dir="up" aria-label="Haut">▲</button>
    <button class="left" data-dir="left" aria-label="Gauche">◀</button>
    <button class="right" data-dir="right" aria-label="Droite">▶</button>
    <button class="down" data-dir="down" aria-label="Bas">▼</button>
  </div>
  <div class="side">
    <span style="opacity:.5">v1.0</span>
  </div>
</div>

<div class="footer">— Strike fast. Strike silent. —</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const stage = document.getElementById('stage');

  const COLS = 20, ROWS = 20;
  let CELL = canvas.width / COLS;

  // Resize the canvas backing store to be crisp on hi-DPI screens.
  function resize(){
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const size = Math.floor(Math.min(rect.width, rect.height));
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    CELL = canvas.width / COLS;
    ctx.imageSmoothingEnabled = false;
  }
  window.addEventListener('resize', resize, {passive:true});
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  const STATE = { MENU:'menu', PLAYING:'playing', PAUSED:'paused', DEAD:'dead' };
  let state = STATE.MENU;

  let snake, dir, nextDir, prey, score, best, tick, speed, growth, shake;

  best = parseInt(localStorage.getItem('mamba.best') || '0', 10);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    speed = 140;
    growth = 0;
    shake = 0;
    spawnPrey();
    scoreEl.textContent = '0';
  }

  function spawnPrey(){
    const occupied = new Set(snake.map(s=>s.x+','+s.y));
    let x,y;
    do { x = Math.floor(Math.random()*COLS); y = Math.floor(Math.random()*ROWS); }
    while (occupied.has(x+','+y));
    prey = {x,y,t:0};
  }

  function step(){
    if (state !== STATE.PLAYING) return;
    // commit queued direction (prevents instant 180° flips mid-tick)
    if (Math.abs(nextDir.x) !== Math.abs(dir.x) || Math.abs(nextDir.y) !== Math.abs(dir.y)) {
      dir = nextDir;
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) return die();
    for (let i=0;i<snake.length;i++) if (snake[i].x===head.x && snake[i].y===head.y) return die();

    snake.unshift(head);

    if (head.x===prey.x && head.y===prey.y){
      score += 10;
      growth += 2;
      shake = 6;
      scoreEl.textContent = score;
      if (speed > 60) speed = Math.max(60, speed - 3);
      spawnPrey();
    }

    if (growth > 0) growth--; else snake.pop();
  }

  function die(){
    state = STATE.DEAD;
    shake = 18;
    if (score > best){
      best = score;
      localStorage.setItem('mamba.best', String(best));
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'ENVENIMÉ';
    overlayTitle.classList.add('dead');
    overlayText.innerHTML = `Le mamba s'est mordu la queue.<br>Score : <b style="color:#7CFC00">${score}</b> · Meilleur : <b style="color:#d4af37">${best}</b>`;
    startBtn.textContent = 'REJOUER';
    overlay.classList.remove('hidden');
    if (navigator.vibrate) navigator.vibrate([40,40,80]);
  }

  function setDir(nx, ny){
    if (state === STATE.MENU || state === STATE.DEAD) return;
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = {x:nx, y:ny};
  }

  // --- Rendering ---
  function draw(){
    const W = canvas.width, H = canvas.height;
    ctx.save();
    if (shake > 0){
      const s = shake;
      ctx.translate((Math.random()-.5)*s, (Math.random()-.5)*s);
      shake -= 1;
    }
    // Background
    ctx.fillStyle = '#050605';
    ctx.fillRect(0,0,W,H);

    // Subtle grid
    ctx.strokeStyle = 'rgba(124,252,0,0.04)';
    ctx.lineWidth = 1;
    for (let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(W,i*CELL); ctx.stroke();
    }

    // Prey: blood-red rodent dot with pulse
    prey.t += 0.15;
    const pulse = (Math.sin(prey.t)+1)/2;
    const px = prey.x*CELL + CELL/2;
    const py = prey.y*CELL + CELL/2;
    const r = CELL*0.32 + pulse*CELL*0.06;
    const grd = ctx.createRadialGradient(px,py,1, px,py,r*1.4);
    grd.addColorStop(0,'#ff5050');
    grd.addColorStop(.6,'#8b0000');
    grd.addColorStop(1,'rgba(139,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(px,py,r*1.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd0d0';
    ctx.beginPath(); ctx.arc(px-r*0.25,py-r*0.25,r*0.18,0,Math.PI*2); ctx.fill();

    // Snake — black mamba: dark olive body with venomous green underbelly
    for (let i = snake.length-1; i >= 0; i--){
      const s = snake[i];
      const x = s.x*CELL, y = s.y*CELL;
      const isHead = i === 0;
      const t = i / Math.max(snake.length-1,1);

      // Outer body
      const bodyGrd = ctx.createLinearGradient(x,y,x+CELL,y+CELL);
      bodyGrd.addColorStop(0, isHead ? '#2d3d31' : '#1a231c');
      bodyGrd.addColorStop(1, isHead ? '#0a120c' : '#050805');
      ctx.fillStyle = bodyGrd;
      roundRect(ctx, x+1, y+1, CELL-2, CELL-2, CELL*0.28);
      ctx.fill();

      // Scale shimmer
      ctx.fillStyle = `rgba(124,252,0,${0.04 + (1-t)*0.05})`;
      roundRect(ctx, x+CELL*0.18, y+CELL*0.18, CELL*0.64, CELL*0.2, CELL*0.1);
      ctx.fill();

      if (isHead){
        // Head plates
        ctx.fillStyle = '#0a0f0a';
        roundRect(ctx, x+CELL*0.15, y+CELL*0.15, CELL*0.7, CELL*0.7, CELL*0.22);
        ctx.fill();

        // Eyes — venom green slits
        const eyeOff = CELL*0.22;
        let exL, eyL, exR, eyR;
        if (dir.x === 1){       exL = x+CELL-eyeOff; eyL = y+eyeOff;       exR = x+CELL-eyeOff; eyR = y+CELL-eyeOff; }
        else if (dir.x === -1){ exL = x+eyeOff;      eyL = y+eyeOff;       exR = x+eyeOff;      eyR = y+CELL-eyeOff; }
        else if (dir.y === 1){  exL = x+eyeOff;      eyL = y+CELL-eyeOff;  exR = x+CELL-eyeOff; eyR = y+CELL-eyeOff; }
        else {                  exL = x+eyeOff;      eyL = y+eyeOff;       exR = x+CELL-eyeOff; eyR = y+eyeOff; }

        ctx.fillStyle = '#7CFC00';
        ctx.shadowColor = '#7CFC00';
        ctx.shadowBlur = CELL*0.4;
        ctx.beginPath(); ctx.arc(exL, eyL, CELL*0.07, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(exR, eyR, CELL*0.07, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000';
        ctx.fillRect(exL-CELL*0.015, eyL-CELL*0.06, CELL*0.03, CELL*0.12);
        ctx.fillRect(exR-CELL*0.015, eyR-CELL*0.06, CELL*0.03, CELL*0.12);

        // Forked tongue
        const tx = x + CELL/2 + dir.x*CELL*0.55;
        const ty = y + CELL/2 + dir.y*CELL*0.55;
        ctx.strokeStyle = '#ff2a2a';
        ctx.lineWidth = Math.max(1.5, CELL*0.06);
        ctx.lineCap = 'round';
        const flick = (Math.sin(performance.now()/80)+1)/2;
        ctx.beginPath();
        ctx.moveTo(x+CELL/2 + dir.x*CELL*0.4, y+CELL/2 + dir.y*CELL*0.4);
        ctx.lineTo(tx, ty);
        const fx = -dir.y * CELL*0.12 * flick;
        const fy =  dir.x * CELL*0.12 * flick;
        ctx.moveTo(tx, ty); ctx.lineTo(tx+fx, ty+fy);
        ctx.moveTo(tx, ty); ctx.lineTo(tx-fx, ty-fy);
        ctx.stroke();
      } else {
        // Body diamond pattern
        if (i % 2 === 0){
          ctx.fillStyle = 'rgba(212,175,55,0.08)';
          ctx.beginPath();
          ctx.moveTo(x+CELL/2, y+CELL*0.32);
          ctx.lineTo(x+CELL*0.68, y+CELL/2);
          ctx.lineTo(x+CELL/2, y+CELL*0.68);
          ctx.lineTo(x+CELL*0.32, y+CELL/2);
          ctx.closePath(); ctx.fill();
        }
      }
    }

    ctx.restore();

    // Vignette
    const v = ctx.createRadialGradient(W/2,H/2,W*0.3, W/2,H/2,W*0.75);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle = v;
    ctx.fillRect(0,0,W,H);
  }

  function roundRect(ctx,x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // --- Main loop: fixed-step logic, animated draw ---
  let last = performance.now();
  let acc = 0;
  function loop(now){
    const dt = now - last; last = now;
    if (state === STATE.PLAYING){
      acc += dt;
      while (acc >= speed){ step(); acc -= speed; }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // --- Input ---
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'w') setDir(0,-1);
    else if (k === 'ArrowDown' || k === 's') setDir(0,1);
    else if (k === 'ArrowLeft' || k === 'a') setDir(-1,0);
    else if (k === 'ArrowRight' || k === 'd') setDir(1,0);
    else if (k === ' ' || k === 'p') togglePause();
    else if (k === 'Enter' && (state === STATE.MENU || state === STATE.DEAD)) start();
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  }, {passive:false});

  document.querySelectorAll('.pad button').forEach(b => {
    const handler = e => {
      e.preventDefault();
      const d = b.dataset.dir;
      if (d === 'up') setDir(0,-1);
      if (d === 'down') setDir(0,1);
      if (d === 'left') setDir(-1,0);
      if (d === 'right') setDir(1,0);
    };
    b.addEventListener('touchstart', handler, {passive:false});
    b.addEventListener('mousedown', handler);
  });

  // Swipe
  let touchStart = null;
  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 1){ touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now()}; }
  }, {passive:true});
  stage.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx,ady) < 18){
      // Tap = pause/start
      if (state === STATE.MENU || state === STATE.DEAD) start();
      else togglePause();
    } else if (adx > ady){
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
    touchStart = null;
  }, {passive:true});

  pauseBtn.addEventListener('click', togglePause);
  startBtn.addEventListener('click', start);

  function start(){
    reset();
    state = STATE.PLAYING;
    overlayTitle.classList.remove('dead');
    overlay.classList.add('hidden');
  }
  function togglePause(){
    if (state === STATE.PLAYING){
      state = STATE.PAUSED;
      overlayTitle.textContent = 'EN ATTENTE';
      overlayTitle.classList.remove('dead');
      overlayText.innerHTML = 'Le mamba se cache dans l\'ombre.<br>Reprenez quand vous êtes prêt.';
      startBtn.textContent = 'REPRENDRE';
      overlay.classList.remove('hidden');
    } else if (state === STATE.PAUSED){
      state = STATE.PLAYING;
      overlay.classList.add('hidden');
    }
  }

  // Boot
  reset();
  resize();
  requestAnimationFrame(loop);

  // Prevent pull-to-refresh / overscroll on iOS
  document.addEventListener('touchmove', e => { if (e.target.closest('.stage,.controls')) e.preventDefault(); }, {passive:false});
})();
</script>
</body>
</html>
